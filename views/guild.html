<div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>

<script>
const guildId = (location.pathname.match(/\/guild\/(\d+)/) || [])[1] || '';

const TABS = ['overview','commands','overrides','tags','settings','automod','starboard','counting','levels','echochambers','invites','boosts','moderation','security','voicemaster','tickets'];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function api(path, opts) {
  try {
    const res = await fetch(path, opts || {});
    let data = null;
    try { data = await res.json(); } catch {}
    if (!res.ok) return { ok: false, error: (data && data.error) || ('HTTP ' + res.status) };
    return data || { ok: false, error: 'invalid_response' };
  } catch {
    return { ok: false, error: 'network_error' };
  }
}

function toast(msg, type) {
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'success' ? ' toast-success' : type === 'error' ? ' toast-error' : '');
  el.textContent = msg;
  el.onclick = () => el.remove();
  c.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

let savedTimer = null;
function showSaved() {
  const el = document.getElementById('saveIndicator');
  el.classList.add('show');
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => el.classList.remove('show'), 1500);
}

function showMsg(text, type) {
  const host = document.getElementById('tab-content');
  if (!host) return;
  let el = document.getElementById('tab-msg');
  if (!el) {
    el = document.createElement('div');
    el.id = 'tab-msg';
    host.prepend(el);
  }
  el.className = 'msg ' + (type === 'success' ? 'msg-success' : 'msg-error');
  el.textContent = text;
  if (type === 'success') setTimeout(() => { if (el.parentNode) el.remove(); }, 4000);
}

function setToggle(id, on) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle('on', !!on);
  el.dataset.disabled = String(!on);
}

let loadSeq = 0;
const tabProgress = document.getElementById('tabProgress');
const tabOverlay = document.getElementById('tabOverlay');
const tabOverlayLabel = document.getElementById('tabOverlayLabel');
let overlayTimer = null;

const TAB_SKELETON = `<div class="page-skeleton" aria-hidden="true">
  <div class="gsk-bar gsk-title"></div>
  <div class="gsk-bar gsk-desc"></div>
  <div class="gsk-stats">
    <div class="gsk-stat"></div><div class="gsk-stat"></div>
    <div class="gsk-stat"></div><div class="gsk-stat"></div>
  </div>
  <div class="gsk-panel"></div>
  <div class="gsk-panel short"></div>
</div>`;

function setTabBusy(on, label) {
  const host = document.getElementById('tab-content');
  if (host) host.setAttribute('aria-busy', String(!!on));
  tabProgress.classList.toggle('show', !!on);
  clearTimeout(overlayTimer);
  if (!on) {
    tabOverlay.classList.remove('show');
    tabOverlay.setAttribute('aria-hidden', 'true');
    return;
  }
  overlayTimer = setTimeout(() => {
    tabOverlayLabel.textContent = label || 'Loading…';
    tabOverlay.classList.add('show');
    tabOverlay.setAttribute('aria-hidden', 'false');
  }, 160);
}

async function switchTab(tab) {
  if (!tab || !TABS.includes(tab)) tab = 'overview';
  hideTooltip();
  const seq = ++loadSeq;
  document.querySelectorAll('.sidebar-item').forEach(el => {
    const active = el.dataset.tab === tab;
    el.classList.toggle('active', active);
    if (active) el.setAttribute('aria-current', 'page');
    else el.removeAttribute('aria-current');
  });
  if (location.hash !== '#' + tab) history.replaceState(null, '', '#' + tab);
  const host = document.getElementById('tab-content');
  const tabLabel = document.querySelector(`.sidebar-item[data-tab="${tab}"]`)?.textContent.trim() || 'dashboard';
  host.innerHTML = TAB_SKELETON;
  closeSidebar();
  setTabBusy(true, 'Loading ' + tabLabel + '…');
  try {
    const res = await fetch('/dashboard/' + tab + '.html');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const html = await res.text();
    if (seq !== loadSeq) return;
    host.innerHTML = html;
    const mod = await import('/dashboard/' + tab + '.js?v=' + Date.now());
    if (seq !== loadSeq) return;
    if (typeof mod.init === 'function') {
      await mod.init({ guildId, api, esc, showMsg, toast, showSaved, confirmAsync, inputAsync, textareaAsync, emojiPickerAsync, channelPickerWithReloadAsync, setToggle, switchTab, showProfileModal });
    }
    if (seq !== loadSeq) return;
    setTabBusy(false);
  } catch (e) {
    if (seq !== loadSeq) return;
    setTabBusy(false);
    host.innerHTML = '<div class="msg msg-error" style="margin-top:var(--sp-4)">Failed to load this tab: ' + esc(e.message) + '</div>';
  }
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
  document.getElementById('hamburger').setAttribute('aria-expanded', 'false');
}

function focusModal(modal) {
  hideTooltip();
  const target = modal.querySelector('input:not([type="hidden"]), textarea, select, button');
  if (target) setTimeout(() => target.focus(), 30);
}

/* Keyboard access for toggle widgets (role=switch) */
function enhanceToggles(root) {
  const scope = root || document;
  const toggles = [...scope.querySelectorAll('.toggle')];
  if (scope.nodeType === 1 && scope.matches('.toggle')) toggles.push(scope);
  toggles.forEach(t => {
    if (!t.hasAttribute('role')) t.setAttribute('role', 'switch');
    t.setAttribute('tabindex', '0');
    t.setAttribute('aria-checked', t.classList.contains('on') ? 'true' : 'false');
  });
}
const toggleObserver = new MutationObserver(muts => {
  for (const m of muts) {
    if (m.type === 'attributes' && m.target.classList.contains('toggle')) {
      m.target.setAttribute('aria-checked', m.target.classList.contains('on') ? 'true' : 'false');
    } else if (m.type === 'childList') {
      m.addedNodes.forEach(n => { if (n.nodeType === 1) enhanceToggles(n); });
    }
  }
});
toggleObserver.observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class'] });
enhanceToggles(document);

document.addEventListener('keydown', e => {
  const t = e.target;
  if ((e.key === ' ' || e.key === 'Enter') && t.classList && t.classList.contains('toggle')) {
    e.preventDefault();
    t.click();
    return;
  }
  if (e.key !== 'Tab') return;
  const modal = [...document.querySelectorAll('.modal-overlay')].find(m => m.style.display === 'flex');
  if (!modal) return;
  const focusables = [...modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
    .filter(el => !el.disabled && el.offsetParent !== null);
  if (!focusables.length) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

document.addEventListener('click', e => { window._altClickHeld = e.altKey; }, true);

let _lastFocus = null;
function rememberFocus() { _lastFocus = document.activeElement; }
function restoreFocus() {
  if (_lastFocus && document.contains(_lastFocus)) _lastFocus.focus();
  _lastFocus = null;
}

let _confirmResolve = null;
function confirmAsync(title, bodyHtml, hint) {
  if (window._altClickHeld) return Promise.resolve(true);
  return new Promise(resolve => {
    if (_confirmResolve) { _confirmResolve(false); }
    _confirmResolve = resolve;
    rememberFocus();
    document.getElementById('confirmTitle').textContent = title || 'Confirm';
    document.getElementById('confirmBody').innerHTML = bodyHtml || '';
    const hintEl = document.getElementById('confirmHint');
    if (hint) { hintEl.textContent = hint; hintEl.style.display = 'block'; } else { hintEl.style.display = 'none'; }
    const modal = document.getElementById('confirmModal');
    modal.style.display = 'flex';
    focusModal(modal);
  });
}
function closeConfirm(value) {
  document.getElementById('confirmModal').style.display = 'none';
  const r = _confirmResolve;
  _confirmResolve = null;
  restoreFocus();
  if (r) r(value);
}

let _promptResolve = null;
function openPrompt(title, label, value, placeholder, multiline) {
  return new Promise(resolve => {
    if (_promptResolve) { _promptResolve(null); }
    _promptResolve = resolve;
    rememberFocus();
    document.getElementById('promptTitle').textContent = title || 'Input';
    document.getElementById('promptLabel').textContent = label || '';
    document.getElementById('promptLabel').htmlFor = multiline ? 'promptTextarea' : 'promptInput';
    const inp = document.getElementById('promptInput');
    const ta = document.getElementById('promptTextarea');
    if (multiline) {
      inp.style.display = 'none';
      ta.style.display = 'block';
      ta.value = value || '';
      ta.placeholder = placeholder || '';
      setTimeout(() => ta.focus(), 30);
    } else {
      ta.style.display = 'none';
      inp.style.display = 'block';
      inp.value = value || '';
      inp.placeholder = placeholder || '';
      setTimeout(() => inp.focus(), 30);
    }
    document.getElementById('promptModal').style.display = 'flex';
  });
}
function closePrompt(value) {
  document.getElementById('promptModal').style.display = 'none';
  const r = _promptResolve;
  _promptResolve = null;
  restoreFocus();
  if (r) r(value);
}
function inputAsync(title, label, placeholder, value) {

let _pickerResolve = null;
function closePicker(value) {
  document.getElementById('pickerModal').style.display = 'none';
  const r = _pickerResolve;
  _pickerResolve = null;
  restoreFocus();
  if (r) r(value);
}
function openPicker(title, desc, contentHtml, onReady) {
  return new Promise(resolve => {
    if (_pickerResolve) { _pickerResolve(null); }
    _pickerResolve = resolve;
    rememberFocus();
    document.getElementById('pickerTitle').textContent = title || 'Select';
    document.getElementById('pickerDesc').textContent = desc || '';
    const content = document.getElementById('pickerContent');
    content.innerHTML = contentHtml;
    const ok = document.getElementById('pickerOk');
    ok.style.display = 'none';
    document.getElementById('pickerModal').style.display = 'flex';
    focusModal(document.getElementById('pickerModal'));
    if (onReady) onReady(content);
  });
}

function emojiPickerAsync(title, desc, defaultEmojis, customEmojis) {
  let html = '';
  if (defaultEmojis && defaultEmojis.length) {
    html += '<div class="pill-list">' + defaultEmojis.map(e =>
      '<button type="button" class="btn btn-secondary picker-emoji" data-emoji="' + esc(e) + '" style="font-size:18px;height:36px;width:36px;padding:0">' + e + '</button>'
    ).join('') + '</div>';
  }
  if (customEmojis && customEmojis.length) {
    html += '<div class="pill-list" style="margin-top:var(--sp-3)">' + customEmojis.map(e => {
      const tag = (e.animated ? '<a:' : '<:') + e.name + ':' + e.id + '>';
      return '<button type="button" class="btn btn-secondary picker-emoji" data-emoji="' + esc(tag) + '" style="height:36px;padding:0 var(--sp-2)">' +
        '<img src="https://cdn.discordapp.com/emojis/' + e.id + (e.animated ? '.gif' : '.png') + '?size=20" alt="" style="width:18px;height:18px"> ' + esc(e.name) + '</button>';
    }).join('') + '</div>';
  }
  html += '<div class="form-group" style="margin-top:var(--sp-4)"><label class="form-label">Or type an emoji</label><input class="input" id="pickerEmojiInput" placeholder="e.g. ⭐" style="width:100%"></div>';
  return openPicker(title, desc, html, content => {
    content.querySelectorAll('.picker-emoji').forEach(btn => {
      btn.onclick = () => closePicker(btn.dataset.emoji);
    });
    const inp = content.querySelector('#pickerEmojiInput');
    const ok = document.getElementById('pickerOk');
    ok.style.display = '';
    ok.onclick = () => closePicker(inp.value.trim() || null);
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); ok.click(); } };
  });
}

async function channelPickerWithReloadAsync(title, desc, gId) {
  let channels = [];
  async function load() {
    const tgt = await api('/api/data/guild-targets?guildId=' + encodeURIComponent(gId));
    channels = tgt.ok ? (tgt.channels || []).filter(c => c.type === 0 || c.type === 5) : [];
  }
  await load();
  function optionsHtml() {
    if (!channels.length) return '<option value="">No channels found</option>';
    return channels.map(c => '<option value="' + esc(c.id) + '">#' + esc(c.name) + '</option>').join('');
  }
  return openPicker(title, desc,
    '<div class="form-row"><div class="form-group" style="flex:1"><label class="form-label">Channel</label><select class="input" id="pickerChannelSelect" style="width:100%">' + optionsHtml() + '</select></div>' +
    '<button type="button" class="btn btn-secondary" id="pickerReload">Reload</button></div>',
    content => {
      const ok = document.getElementById('pickerOk');
      ok.style.display = '';
      ok.onclick = () => {
        const sel = content.querySelector('#pickerChannelSelect');
        closePicker(sel.value || null);
      };
      content.querySelector('#pickerReload').onclick = async () => {
        const btn = content.querySelector('#pickerReload');
        btn.disabled = true;
        await load();
        content.querySelector('#pickerChannelSelect').innerHTML = optionsHtml();
        btn.disabled = false;
      };
    });
}

function closeProfile() {
  document.getElementById('profileModal').style.display = 'none';
  restoreFocus();
}
function showProfileModal(userId, guildIdArg) {
  const overlay = document.getElementById('profileModal');
  const content = document.getElementById('profileModalContent');

  rememberFocus();
  content.innerHTML = '<div class="loading" style="padding:var(--sp-8)">Loading...</div>';
  overlay.style.display = 'flex';
  focusModal(overlay);

  api('/api/data/guild-user-info?userId=' + userId + '&guildId=' + guildIdArg).then(res => {
    if (!res.ok) throw new Error(res.error || 'Failed to load profile');
    const u = res.user;

    const displayName = u.member?.nickname || u.globalName || u.username;
    const hasGlobalName = u.globalName && u.globalName !== u.username;

    const avatarUrl = u.avatar
      ? 'https://cdn.discordapp.com/avatars/' + u.id + '/' + u.avatar + '.' + (u.avatar.startsWith('a_') ? 'gif' : 'png') + '?size=256'
      : 'https://cdn.discordapp.com/embed/avatars/' + (parseInt(u.discriminator) % 5) + '.png';

    const bannerUrl = u.banner
      ? 'https://cdn.discordapp.com/banners/' + u.id + '/' + u.banner + '.' + (u.banner.startsWith('a_') ? 'gif' : 'png') + '?size=512'
      : null;

    const avatarDecoUrl = u.avatarDecoration
      ? 'https://cdn.discordapp.com/avatar-decoration/' + u.avatarDecoration.asset + '.' + (u.avatarDecoration.animated ? 'gif' : 'png') + '?size=128'
      : null;

    const flags = [];
    const flagMap = {
      STAFF: 'Discord Staff', PARTNER: 'Partner', HYPESQUAD: 'HypeSquad Events',
      BUG_HUNTER_LEVEL_1: 'Bug Hunter 1', BUG_HUNTER_LEVEL_2: 'Bug Hunter 2',
      VERIFIED_BOT: 'Verified Bot', VERIFIED_DEVELOPER: 'Verified Developer',
      EARLY_VERIFIED_BOT_DEVELOPER: 'Early Bot Developer', ACTIVE_DEVELOPER: 'Active Developer',
      CERTIFIED_MODERATOR: 'Certified Moderator'
    };
    for (const f of u.flags) if (flagMap[f]) flags.push(flagMap[f]);

    const bannerBg = u.bannerColor
      ? 'linear-gradient(135deg, ' + u.bannerColor + ', ' + u.bannerColor + 'aa)'
      : 'linear-gradient(135deg, var(--accent), #7289da)';

    const bannerHtml = bannerUrl
      ? '<img src="' + bannerUrl + '" alt="" style="width:100%;height:120px;object-fit:cover">'
      : '<div style="height:120px;background:' + bannerBg + '"></div>';

    const avatarDecoHtml = avatarDecoUrl
      ? '<img src="' + avatarDecoUrl + '" alt="" style="position:absolute;bottom:-4px;right:-4px;width:48px;height:48px;border-radius:50%;border:2px solid var(--bg-0);object-fit:cover">'
      : '';

    const discriminatorHtml = u.discriminator !== '0'
      ? '<span style="color:var(--text-2);font-size:var(--text-sm)">#' + u.discriminator + '</span>'
      : '';

    const botHtml = u.bot ? '<span class="badge badge-blue" style="font-size:var(--text-xs)">Bot</span>' : '';
    const systemHtml = u.system ? '<span class="badge badge-yellow" style="font-size:var(--text-xs)">System</span>' : '';

    const flagsHtml = flags.length
      ? '<div style="margin-top:var(--sp-2);display:flex;flex-wrap:wrap;gap:var(--sp-1)">' + flags.map(f => '<span class="badge badge-blue" style="font-size:var(--text-xs)">' + esc(f) + '</span>').join('') + '</div>'
      : '';

    let serverProfileHtml = '';
    if (u.member) {
      const roles = u.member.roles.filter(r => r.name !== '@everyone').slice(0, 10);
      serverProfileHtml =
        '<div class="card" style="margin-top:var(--sp-4)">' +
          '<div class="card-header">' +
            '<div class="card-title" style="font-size:var(--text-sm);font-weight:600">Server Profile</div>' +
          '</div>' +
          '<div class="card-body" style="display:flex;flex-direction:column;gap:var(--sp-2)">' +
            (u.member.nickname ? '<div><strong>Server Nickname:</strong> ' + esc(u.member.nickname) + '</div>' : '') +
            '<div><strong>Joined:</strong> ' + new Date(u.member.joinedAt).toLocaleDateString() + '</div>' +
            (u.member.premiumSince ? '<div><strong>Boosting since:</strong> ' + new Date(u.member.premiumSince).toLocaleDateString() + '</div>' : '') +
            (roles.length ? '<div><strong>Roles (' + u.member.roles.length + '):</strong></div><div class="pill-list">' + roles.map(r => '<span class="pill" style="background:' + (r.color ? '#' + r.color.toString(16).padStart(6, '0') : 'var(--bg-3)') + ';border-color:' + (r.color ? '#' + r.color.toString(16).padStart(6, '0') : 'var(--border)') + '">' + esc(r.name) + '</span>').join('') + '</div>' : '') +
          '</div>' +
        '</div>';
    }

    content.innerHTML = bannerHtml +
      '<div style="padding:var(--sp-5);display:flex;gap:var(--sp-4);position:relative;margin-top:-40px">' +
        '<div style="position:relative;flex-shrink:0">' +
          '<img src="' + avatarUrl + '" alt="" style="width:110px;height:110px;border-radius:50%;border:4px solid var(--bg-0);object-fit:cover">' +
          avatarDecoHtml +
        '</div>' +
        '<div style="flex:1;min-width:0;padding-top:var(--sp-3)">' +
          '<div style="display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-1)">' +
            '<span style="font-size:var(--text-xl);font-weight:600;color:var(--text-0)">' + esc(displayName) + '</span>' +
            (hasGlobalName && !u.member?.nickname ? '<span style="font-size:var(--text-sm);color:var(--text-1);font-weight:400">@' + esc(u.username) + '</span>' : '') +
            discriminatorHtml + botHtml + systemHtml +
          '</div>' +
          flagsHtml +
          '<div style="margin-top:var(--sp-2);font-size:var(--text-xs);color:var(--text-2)"><strong>Created:</strong> ' + new Date(u.createdAt).toLocaleDateString() + '</div>' +
        '</div>' +
      '</div>' +
      serverProfileHtml +
      '<div style="padding:var(--sp-4);border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:var(--sp-2)">' +
        '<button class="btn btn-ghost" onclick="closeProfile()">Close</button>' +
      '</div>';
    focusModal(overlay);
  }).catch(e => {
    content.innerHTML = '<div class="msg msg-error" style="margin:var(--sp-4);padding:var(--sp-4)">' + esc(e.message) + '</div>';
  });
}

/* ---------- Tooltips ---------- */
const tooltipEl = document.createElement('div');
tooltipEl.className = 'tooltip';
tooltipEl.id = 'tooltip';
tooltipEl.setAttribute('role', 'tooltip');
tooltipEl.setAttribute('aria-hidden', 'true');
document.body.appendChild(tooltipEl);

let tooltipTarget = null;
let tooltipShowTimer = null;
let tooltipHideTimer = null;
let tooltipTouchTimer = null;

function restoreTooltipTrigger(target) {
  if (!target || target.dataset.tooltipDesc !== '1') return;
  const ids = (target.getAttribute('aria-describedby') || '').split(/\s+/).filter(id => id && id !== 'tooltip');
  if (ids.length) target.setAttribute('aria-describedby', ids.join(' '));
  else target.removeAttribute('aria-describedby');
  delete target.dataset.tooltipDesc;
}

function tooltipPlacement(target, rect, width, height) {
  const gap = 8;
  const edge = 8;
  const top = rect.top >= height + gap + edge;
  const bottom = window.innerHeight - rect.bottom >= height + gap + edge;
  const left = rect.left >= width + gap + edge;
  const right = window.innerWidth - rect.right >= width + gap + edge;
  let placement = target.dataset.tooltipPos || 'auto';

  if (placement === 'auto') placement = top ? 'top' : bottom ? 'bottom' : right ? 'right' : 'left';
  if (placement === 'top' && !top) placement = bottom ? 'bottom' : right ? 'right' : 'left';
  if (placement === 'bottom' && !bottom) placement = top ? 'top' : right ? 'right' : 'left';
  if (placement === 'right' && !right) placement = left ? 'left' : top ? 'top' : 'bottom';
  if (placement === 'left' && !left) placement = right ? 'right' : top ? 'top' : 'bottom';
  return placement;
}

function positionTooltip(target) {
  const rect = target.getBoundingClientRect();
  const gap = 8;
  const edge = 8;
  const width = tooltipEl.offsetWidth;
  const height = tooltipEl.offsetHeight;
  const placement = tooltipPlacement(target, rect, width, height);
  const viewportWidth = window.innerWidth;
  const viewportHeight = window.innerHeight;
  let left = 0;
  let top = 0;

  if (placement === 'top' || placement === 'bottom') {
    left = Math.round(rect.left + rect.width / 2 - width / 2);
    left = Math.max(edge, Math.min(left, viewportWidth - width - edge));
    top = placement === 'top' ? Math.round(rect.top - height - gap) : Math.round(rect.bottom + gap);
    top = Math.max(edge, Math.min(top, viewportHeight - height - edge));
    const arrowX = Math.max(12, Math.min(rect.left + rect.width / 2 - left, width - 12));
    tooltipEl.style.setProperty('--tooltip-arrow-x', arrowX + 'px');
  } else {
    top = Math.round(rect.top + rect.height / 2 - height / 2);
    top = Math.max(edge, Math.min(top, viewportHeight - height - edge));
    left = placement === 'left' ? Math.round(rect.left - width - gap) : Math.round(rect.right + gap);
    left = Math.max(edge, Math.min(left, viewportWidth - width - edge));
    const arrowY = Math.max(12, Math.min(rect.top + rect.height / 2 - top, height - 12));
    tooltipEl.style.setProperty('--tooltip-arrow-y', arrowY + 'px');
  }

  tooltipEl.dataset.placement = placement;
  tooltipEl.style.left = left + 'px';
  tooltipEl.style.top = top + 'px';
}

function showTooltip(target) {
  if (!target || !target.isConnected) return;
  const text = target.dataset.tooltip;
  if (!text) return;
  clearTimeout(tooltipHideTimer);
  if (tooltipTarget && tooltipTarget !== target) restoreTooltipTrigger(tooltipTarget);
  tooltipTarget = target;
  tooltipEl.textContent = text;
  tooltipEl.setAttribute('aria-hidden', 'false');
  tooltipEl.classList.add('visible');
  if (!(target.getAttribute('aria-describedby') || '').split(/\s+/).includes('tooltip')) {
    target.setAttribute('aria-describedby', ((target.getAttribute('aria-describedby') || '') + ' tooltip').trim());
    target.dataset.tooltipDesc = '1';
  }
  positionTooltip(target);
  requestAnimationFrame(() => {
    if (tooltipTarget === target) tooltipEl.classList.add('show');
  });
}

function hideTooltip() {
  clearTimeout(tooltipShowTimer);
  clearTimeout(tooltipHideTimer);
  tooltipEl.classList.remove('show', 'visible');
  tooltipEl.setAttribute('aria-hidden', 'true');
  restoreTooltipTrigger(tooltipTarget);
  tooltipTarget = null;
}

function scheduleTooltipShow(target) {
  clearTimeout(tooltipHideTimer);
  clearTimeout(tooltipShowTimer);
  tooltipShowTimer = setTimeout(() => showTooltip(target), 140);
}

function scheduleTooltipHide() {
  clearTimeout(tooltipShowTimer);
  clearTimeout(tooltipHideTimer);
  tooltipHideTimer = setTimeout(hideTooltip, 80);
}

document.addEventListener('pointerover', e => {
  if (e.pointerType === 'touch') return;
  const target = e.target.closest('[data-tooltip]');
  if (!target) return;
  if (e.relatedTarget && target.contains(e.relatedTarget)) return;
  if (target === tooltipTarget) return;
  scheduleTooltipShow(target);
});

document.addEventListener('pointerout', e => {
  const target = e.target.closest('[data-tooltip]');
  if (!target) return;
  if (e.relatedTarget && target.contains(e.relatedTarget)) return;
  scheduleTooltipHide();
});

document.addEventListener('focusin', e => {
  const target = e.target.closest('[data-tooltip]');
  if (target) showTooltip(target);
});

document.addEventListener('focusout', e => {
  const target = e.target.closest('[data-tooltip]');
  if (!target) return;
  if (e.relatedTarget && target.contains(e.relatedTarget)) return;
  hideTooltip();
});

document.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
  const target = e.target.closest('[data-tooltip]');
  if (!target) return;
  clearTimeout(tooltipTouchTimer);
  showTooltip(target);
  tooltipTouchTimer = setTimeout(() => {
    if (tooltipTarget === target) hideTooltip();
  }, 4500);
});

document.addEventListener('scroll', () => {
  if (!tooltipTarget) return;
  const rect = tooltipTarget.getBoundingClientRect();
  if (rect.bottom < 0 || rect.top > window.innerHeight) hideTooltip();
  else positionTooltip(tooltipTarget);
}, true);
window.addEventListener('resize', hideTooltip);
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTooltip(); });
